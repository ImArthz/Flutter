name: Build APK, Windows, Linux, Web & LaTeX PDF

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # META-DEX TCG STUDIO (Android APK + Web Bundle + Windows EXE + Linux Desktop)
  # ============================================================================
  build-metadex-android-web:
    name: MetaDex - Build Android APK & Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Stable 3.47.7)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Ensure Android Platform & Internet Permission
        run: |
          cd metadex
          flutter create --platforms=android,web --org com.arthur.metadex --project-name metadex .
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Flutter Pub Get
        run: |
          cd metadex
          flutter pub get

      - name: Build Android APK
        run: |
          cd metadex
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/metadex-v1.0.0.apk

      - name: Build Web Bundle
        run: |
          cd metadex
          flutter build web --release
          cd build/web
          zip -r $GITHUB_WORKSPACE/metadex_web.zip .

      - name: Publish MetaDex APK & Web to Release (metadex-v1.0.0)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "metadex-v1.0.0"
          name: "MetaDex TCG Studio v1.0.0 — Pokémon TCG Metagame & Tournament Report"
          make_latest: true
          files: |
            metadex-v1.0.0.apk
            metadex_web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach MetaDex APK & Web to v1.0.3
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.3"
          files: |
            metadex-v1.0.0.apk
            metadex_web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-metadex-windows:
    name: MetaDex - Build Windows EXE
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter (Stable 3.47.7)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Ensure Windows Platform
        run: |
          cd metadex
          flutter create --platforms=windows --org com.arthur.metadex --project-name metadex .

      - name: Flutter Pub Get
        run: |
          cd metadex
          flutter pub get

      - name: Build Windows EXE
        run: |
          cd metadex
          flutter build windows --release

      - name: Zip Windows Release
        run: Compress-Archive -Path metadex\build\windows\x64\runner\Release\* -DestinationPath metadex_windows.zip -Force

      - name: Publish MetaDex Windows ZIP to Release (metadex-v1.0.0)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "metadex-v1.0.0"
          name: "MetaDex TCG Studio v1.0.0 — Pokémon TCG Metagame & Tournament Report"
          make_latest: true
          files: metadex_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach MetaDex Windows ZIP to v1.0.3
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.3"
          files: metadex_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-metadex-linux:
    name: MetaDex - Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter (Stable 3.47.7)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Ensure Linux Platform
        run: |
          cd metadex
          flutter create --platforms=linux --org com.arthur.metadex --project-name metadex .

      - name: Flutter Pub Get
        run: |
          cd metadex
          flutter pub get

      - name: Build Linux App
        run: |
          cd metadex
          flutter build linux --release

      - name: Archive Linux Bundle
        run: |
          cd metadex/build/linux/x64/release/bundle
          tar -czf $GITHUB_WORKSPACE/metadex_linux.tar.gz *

      - name: Publish MetaDex Linux to Release (metadex-v1.0.0)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "metadex-v1.0.0"
          name: "MetaDex TCG Studio v1.0.0 — Pokémon TCG Metagame & Tournament Report"
          make_latest: true
          files: metadex_linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach MetaDex Linux to v1.0.3
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.3"
          files: metadex_linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # PROJETO ARVORES AVANCADAS (AED2) - Mantido para preservar assets no latest
  # ============================================================================
  build-android-pdf:
    name: Build APK and LaTeX (Arvores)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Flutter Shell
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter create --org com.arthur.arvores --project-name arvores_app .
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/g" android/build.gradle 2>/dev/null || true
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Flutter Pub Get
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter pub get

      - name: Build APK
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter build apk --release

      - name: Rename APK
        run: |
          mv projeto_arvores_avancadas/app_flutter/build/app/outputs/flutter-apk/app-release.apk arvores_app-v1.0.3.apk

      - name: Compile LaTeX Document (PT-BR)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: projeto_arvores_avancadas/artigo_academico
          root_file: artigo_arvores.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Compile LaTeX Document (EN)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: projeto_arvores_avancadas/artigo_academico
          root_file: article_trees.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Move PDFs
        run: |
          mv projeto_arvores_avancadas/artigo_academico/artigo_arvores.pdf artigo_arvores.pdf
          mv projeto_arvores_avancadas/artigo_academico/article_trees.pdf article_trees.pdf

      - name: Release APK and PDFs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "metadex-v1.0.0"
          files: |
            arvores_app-v1.0.3.apk
            artigo_arvores.pdf
            article_trees.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows EXE (Arvores)
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Flutter Shell (Windows)
        run: |
          cd projeto_arvores_avancadas\app_flutter
          flutter create --org com.arthur.arvores --project-name arvores_app .

      - name: Flutter Pub Get
        run: |
          cd projeto_arvores_avancadas\app_flutter
          flutter pub get

      - name: Build Windows
        run: |
          cd projeto_arvores_avancadas\app_flutter
          flutter build windows --release

      - name: Zip Output
        run: Compress-Archive -Path projeto_arvores_avancadas\app_flutter\build\windows\x64\runner\Release\* -DestinationPath arvores_app_windows.zip

      - name: Release Windows App
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "metadex-v1.0.0"
          files: arvores_app_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux App (Arvores)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Flutter Shell (Linux)
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter create --org com.arthur.arvores --project-name arvores_app .

      - name: Flutter Pub Get
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter pub get

      - name: Build Linux
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter build linux --release

      - name: Zip Output
        run: |
          cd projeto_arvores_avancadas/app_flutter/build/linux/x64/release/bundle
          tar -czf $GITHUB_WORKSPACE/arvores_app_linux.tar.gz *

      - name: Release Linux App
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "metadex-v1.0.0"
          files: arvores_app_linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}