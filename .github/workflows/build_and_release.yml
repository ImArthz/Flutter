name: Build APK & LaTeX PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'projeto_arvores_avancadas/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and LaTeX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # --- 1. BUILD FLUTTER APK ---
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Flutter Shell
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter create --org com.arthur.arvores --project-name arvores_app .
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/g" android/build.gradle 2>/dev/null || true
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Flutter Pub Get
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter pub get

      - name: Build APK
        run: |
          cd projeto_arvores_avancadas/app_flutter
          flutter build apk --release

      - name: Rename APK
        run: |
          mv projeto_arvores_avancadas/app_flutter/build/app/outputs/flutter-apk/app-release.apk arvores_app-v1.0.3.apk

      # --- 2. COMPILE LATEX ---
      - name: Compile LaTeX Document (PT-BR)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: projeto_arvores_avancadas/artigo_academico
          root_file: artigo_arvores.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Compile LaTeX Document (EN)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: projeto_arvores_avancadas/artigo_academico
          root_file: article_trees.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Move PDFs
        run: |
          mv projeto_arvores_avancadas/artigo_academico/artigo_arvores.pdf artigo_arvores.pdf
          mv projeto_arvores_avancadas/artigo_academico/article_trees.pdf article_trees.pdf

      # --- 3. CREATE RELEASE ---
      - name: Generate Release Tag
        id: tag
        run: echo "RELEASE_TAG=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Release APK and PDFs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Latest Auto-Build (${{ env.RELEASE_TAG }})"
          files: |
            arvores_app-v1.0.3.apk
            artigo_arvores.pdf
            article_trees.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



