name: agenda
description: "An Agenda with customized names to match local culture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  image_picker: ^0.8.7+5
  path_provider: ^2.0.15
  url_launcher: ^6.1.12
  cupertino_icons: ^1.0.8   # movido para cá

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/contatos.json
    - assets/images/default_avatar.png   # se essa imagem não existir, remova a linha