name: arvores_app
description: "Visualizador interativo de Árvores Avançadas — Splay, Trie, Patricia, Treap e KD-Tree"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / Tipografia
  google_fonts: ^6.2.1

  # Gráficos de benchmark
  fl_chart: ^0.68.0

  # State management
  provider: ^6.1.2

  # Exportar CSV
  path_provider: ^2.1.3
  csv: ^6.0.0

  # Ícones
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
