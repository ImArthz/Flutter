name: metadex
description: Aplicativo para relatórios de torneios de Pokémon TCG.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1 # Gerenciamento de estado (MVVM)
  fl_chart: ^0.65.0 # Para criar o gráfico de pizza do metagame
  google_fonts: ^6.1.0 # Para fontes bonitas
  pdf: ^3.11.0 # Para geração do PDF de exportação
  printing: ^5.11.1 # Para salvar/compartilhar o PDF
  http: ^1.2.0 # Para a API do pokemontcg.io
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
